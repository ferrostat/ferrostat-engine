name: Release

# Pushes to main build the release files as workflow artifacts (kept 30
# days); tags v* also publish them as a GitHub release. ci/package.sh names
# the files without a version, so
# <repo>/releases/latest/download/<file> always points at the newest one.
#
# Linux builds run in Debian bookworm (glibc 2.36) so the programs also run on
# older distributions, including Raspberry Pi OS bookworm. The Raspberry Pi
# builds (64-bit aarch64, 32-bit armv7) are cross-compiled.

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  # run by hand on a tag (Run workflow > Use workflow from: Tags > vX.Y.Z)
  # to (re)publish that release
  workflow_dispatch:

permissions:
  contents: write

# a newer run for the same branch or tag cancels the older one
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: build (${{ matrix.target }})
    runs-on: ubuntu-latest
    container: rust:1-bookworm
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu,      cc: '',                      pkg: '' }
          - { target: aarch64-unknown-linux-gnu,     cc: aarch64-linux-gnu-gcc,   pkg: gcc-aarch64-linux-gnu }
          - { target: armv7-unknown-linux-gnueabihf, cc: arm-linux-gnueabihf-gcc, pkg: gcc-arm-linux-gnueabihf }
    steps:
      - uses: actions/checkout@v4
      - name: Cross toolchain
        if: matrix.cc != ''
        run: |
          apt-get update -qq && apt-get install -y -qq ${{ matrix.pkg }} >/dev/null
          rustup target add ${{ matrix.target }}
          echo "CARGO_TARGET_$(echo ${{ matrix.target }} | tr a-z- A-Z_)_LINKER=${{ matrix.cc }}" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --release -p ferrostat-repl -p ferrostat-gui --target ${{ matrix.target }}
      - name: Package
        run: |
          # the tag, or <branch>-<short sha>
          VERSION=$GITHUB_REF_NAME; [ "$GITHUB_REF_TYPE" = tag ] || VERSION=$GITHUB_REF_NAME-${GITHUB_SHA::8}
          ci/package.sh ${{ matrix.target }} "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/
          retention-days: 30

  native:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: macos-latest,   target: aarch64-apple-darwin }
          - { os: macos-latest,   target: x86_64-apple-darwin }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release -p ferrostat-repl -p ferrostat-gui --target ${{ matrix.target }}
      - name: Package
        run: |
          # the tag, or <branch>-<short sha>
          VERSION=$GITHUB_REF_NAME; [ "$GITHUB_REF_TYPE" = tag ] || VERSION=$GITHUB_REF_NAME-${GITHUB_SHA::8}
          ci/package.sh ${{ matrix.target }} "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/
          retention-days: 30

  wasm:
    name: build (wasm32, browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-bindgen (version from Cargo.lock)
        run: |
          v=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/version = "\(.*\)"/\1/p')
          echo "WASM_BINDGEN=$v" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ env.WASM_BINDGEN }}
      - name: Build
        run: ./ferrostat-wasm/build.sh
      - name: Package
        run: |
          # the tag, or <branch>-<short sha>
          VERSION=$GITHUB_REF_NAME; [ "$GITHUB_REF_TYPE" = tag ] || VERSION=$GITHUB_REF_NAME-${GITHUB_SHA::8}
          ci/package.sh wasm32-web "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-wasm32-web
          path: dist/
          retention-days: 30

  # One job publishes the release after every build has finished, so the
  # release is created once with all files (jobs uploading in parallel race).
  publish:
    name: publish release
    if: github.ref_type == 'tag'
    needs: [linux, native, wasm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: List files
        run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Ferrostat ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
