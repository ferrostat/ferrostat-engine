name: Pages

# The home page (site/) with download
# links to the latest release, and the browser build under /app/. Deployed on
# every push to main and after each release. Needs Pages enabled for the
# repository (Settings > Pages > Source: GitHub Actions).
#
# Releases trigger it through workflow_run, which runs in the context of the
# default branch: the github-pages environment only accepts deployments from
# it, so a tag push could not deploy directly.
on:
  push:
    branches: [main, master]
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# only the latest deployment runs: a newer one cancels the older
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # From Release, only runs started by a v* tag (pushes to main are already
    # covered by the push trigger).
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'push' && startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-bindgen (version from Cargo.lock)
        run: |
          v=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/version = "\(.*\)"/\1/p')
          echo "WASM_BINDGEN=$v" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ env.WASM_BINDGEN }}
      - name: Build
        run: ./ferrostat-wasm/build.sh
      - name: Assemble site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf public && mkdir public
          cp site/* public/
          cp assets/icon-64.png assets/logo-wordmark.png assets/donate-btc.png assets/donate-eth.png public/
          sed -i -e "s|@PROJECT_URL@|$GITHUB_SERVER_URL/$GITHUB_REPOSITORY|g" -e "s|@FORGE@|github|g" public/index.html
          cp -r ferrostat-wasm/web public/app
          # Release metadata for the page (version, which assets exist); optional.
          curl --fail --silent --header "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/latest" \
            -o public/release.json || rm -f public/release.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
