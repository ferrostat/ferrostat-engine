[workspace]
members = [
    "ferrostat-core",
    "ferrostat-parser",
    "ferrostat-engine",
    "ferrostat-cmd",
    "ferrostat-ado",
    "ferrostat-repl",
    "ferrostat-gui",
    "ferrostat-wasm",
    "ferrostat-tests",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Ferrostat Contributors"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
regex = "1"
chrono = "0.4"
csv = "1"
plotters = "0.3"
statrs = "0.17"
lazy_static = "1"

# keep build directories small: no debug info for third-party crates
[profile.dev.package."*"]
debug = false
