[workspace]
members = [
    "ferrostat-core",
    "ferrostat-parser",
    "ferrostat-engine",
    "ferrostat-cmd",
    "ferrostat-ado",
    "ferrostat-repl",
    "ferrostat-gui",
    "ferrostat-wasm",
    "ferrostat-tests",
]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
authors = ["Ferrostat Contributors"]
license = "GPL-3.0-or-later"

[workspace.dependencies]
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
regex = "1"
chrono = "0.4"
csv = "1"
# text is drawn with an embedded font (ab_glyph), not the system font library
plotters = { version = "0.3", default-features = false, features = ["bitmap_backend", "svg_backend", "all_series", "all_elements", "full_palette", "ab_glyph"] }
statrs = "0.17"
lazy_static = "1"

# keep build directories small: no debug info for third-party crates
[profile.dev.package."*"]
debug = false
