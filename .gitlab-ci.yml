# GitLab CI — mirrors .github/workflows (ci.yml, pages.yml, release.yml).
#
# Pipelines on main build the release archives as job artifacts (kept 30 days);
# tags v* also publish them as a GitLab release. Pages serves site/ as the home
# page, with the browser build under /app/.
#
# Runners: Linux jobs use the default gitlab.com shared runners. Windows jobs use the
# shared Windows runners (saas-windows-medium-amd64). macOS runners are only
# available on Premium/Ultimate, so the macOS jobs run only when the CI/CD
# variable MACOS_RUNNER is set to "true" (Settings > CI/CD > Variables).

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_PIPELINE_SOURCE == "web"

stages:
  - test
  - build
  - release
  - deploy

variables:
  CARGO_TERM_COLOR: always
  CARGO_HOME: $CI_PROJECT_DIR/.cargo

default:
  image: rust:latest
  interruptible: true

.rules-ci: &rules-ci
  - if: $CI_COMMIT_TAG
    when: never
  - when: on_success

.rules-release: &rules-release
  - if: $CI_COMMIT_TAG =~ /^v/

# Archives are built on tags and on every push to the default branch.
.rules-build: &rules-build
  - if: $CI_COMMIT_TAG =~ /^v/
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "merge_request_event"

.linux:
  cache:
    key:
      prefix: $CI_JOB_NAME_SLUG
      files: [Cargo.lock]
    paths:
      - .cargo/registry/index
      - .cargo/registry/cache
      - .cargo/git/db
      - .cargo/bin
      - target

.windows:
  tags: [saas-windows-medium-amd64]
  before_script:
    - Invoke-WebRequest -Uri https://win.rustup.rs/x86_64 -OutFile rustup-init.exe
    - .\rustup-init.exe -y --profile minimal --default-toolchain stable
    - $env:Path = "$env:CARGO_HOME\bin;$env:Path"

.macos:
  image: macos-14-xcode-15
  tags: [saas-macos-medium-m1]
  before_script:
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
    - . "$CARGO_HOME/env"

# Installs wasm-bindgen-cli at the version pinned in Cargo.lock.
.wasm-setup: &wasm-setup
  # CARGO_HOME is redirected into the project for caching, so `cargo install`
  # puts binaries there rather than in the image's /usr/local/cargo/bin
  - export PATH="$CARGO_HOME/bin:$PATH"
  - rustup target add wasm32-unknown-unknown
  - v=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/version = "\(.*\)"/\1/p')
  - |
    if [ "$(wasm-bindgen --version 2>/dev/null)" != "wasm-bindgen $v" ]; then
      cargo install wasm-bindgen-cli --version "$v" --locked --force
    fi

# ---------------------------------------------------------------- test

test:linux:
  extends: .linux
  stage: test
  rules: *rules-ci
  script:
    - cargo build --workspace --all-targets
    - cargo test --workspace

test:windows:
  extends: .windows
  stage: test
  rules: *rules-ci
  script:
    - cargo build --workspace --all-targets
    - cargo test --workspace

test:macos:
  extends: .macos
  stage: test
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $MACOS_RUNNER == "true"
  script:
    - cargo build --workspace --all-targets
    - cargo test --workspace

wasm:
  extends: .linux
  stage: test
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "merge_request_event"
      when: never  # build:wasm builds it
    - when: on_success
  script:
    - *wasm-setup
    - ./ferrostat-wasm/build.sh

# ------------------------------------------------------------- release
# Each build job runs ci/package.sh (shared with the GitHub workflow), which
# leaves in dist/ the archive and the two bare executables under version-free
# names. dist/ is a job artifact, so builds from main can be downloaded too. On
# tags the release job uploads everything to the generic package registry and
# links it from the GitLab release.
#
# Linux builds use Debian bookworm (glibc 2.36) so the programs also run on
# older distributions, including Raspberry Pi OS bookworm. The Raspberry Pi
# builds (64-bit aarch64, 32-bit armv7) are cross-compiled.

.artifacts: &artifacts
  name: $CI_JOB_NAME_SLUG-$CI_COMMIT_REF_SLUG
  paths: [dist/]
  expire_in: 30 days

.version: &version
  - version=${CI_COMMIT_TAG:-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA}

build:linux:
  extends: .linux
  image: rust:1-bookworm
  stage: build
  rules: *rules-build
  parallel:
    matrix:
      - TARGET: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu, armv7-unknown-linux-gnueabihf]
  script:
    - |
      case $TARGET in
        aarch64-*) cc=aarch64-linux-gnu-gcc; pkg=gcc-aarch64-linux-gnu ;;
        armv7-*)   cc=arm-linux-gnueabihf-gcc; pkg=gcc-arm-linux-gnueabihf ;;
        *)         cc= ;;
      esac
      if [ -n "$cc" ]; then
        apt-get update -qq && apt-get install -y -qq "$pkg" >/dev/null
        rustup target add "$TARGET"
        export CARGO_TARGET_$(echo "$TARGET" | tr a-z- A-Z_)_LINKER=$cc
      fi
    - cargo build --release -p ferrostat-repl -p ferrostat-gui --target $TARGET
    - *version
    - ci/package.sh $TARGET "$version"
  artifacts: *artifacts

build:windows:
  extends: .windows
  stage: build
  rules: *rules-build
  variables:
    TARGET: x86_64-pc-windows-msvc
  script:
    - cargo build --release -p ferrostat-repl -p ferrostat-gui --target $env:TARGET
    - $ver = if ($env:CI_COMMIT_TAG) { $env:CI_COMMIT_TAG } else { "$env:CI_COMMIT_REF_SLUG-$env:CI_COMMIT_SHORT_SHA" }
    - '& "C:\Program Files\Git\bin\bash.exe" ci/package.sh $env:TARGET $ver'
    - if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  artifacts: *artifacts

build:macos:
  extends: .macos
  stage: build
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/ && $MACOS_RUNNER == "true"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "merge_request_event" && $MACOS_RUNNER == "true"
  parallel:
    matrix:
      - TARGET: [aarch64-apple-darwin, x86_64-apple-darwin]
  script:
    - rustup target add $TARGET
    - cargo build --release -p ferrostat-repl -p ferrostat-gui --target $TARGET
    - *version
    - ci/package.sh $TARGET "$version"
  artifacts: *artifacts

build:wasm:
  extends: .linux
  stage: build
  rules: *rules-build
  script:
    - *wasm-setup
    - ./ferrostat-wasm/build.sh
    - apt-get update -qq && apt-get install -y -qq zip >/dev/null
    - *version
    - ci/package.sh wasm32-web "$version"
  artifacts:
    <<: *artifacts
    paths: [dist/, ferrostat-wasm/web/]

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules: *rules-release
  interruptible: false
  needs:
    - build:linux
    - build:windows
    - build:wasm
    - job: build:macos
      optional: true
  script:
    - apk add --no-cache curl
    - |
      set --
      for f in dist/*; do
        asset=$(basename "$f")
        url="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/ferrostat/$CI_COMMIT_TAG/$asset"
        curl --fail --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$f" "$url"
        # filepath makes <project>/-/releases/permalink/latest/downloads/<asset>
        # point at the newest release (the home page links there)
        set -- "$@" --assets-link "{\"name\":\"$asset\",\"url\":\"$url\",\"filepath\":\"/$asset\",\"link_type\":\"package\"}"
      done
      release-cli create --name "$CI_COMMIT_TAG" --tag-name "$CI_COMMIT_TAG" "$@"

# --------------------------------------------------------------- pages
# Home page (site/) with download links to the latest release, and the browser
# build under /app/. Deployed automatically on every push to main and after
# each release.

pages:
  stage: deploy
  image: alpine:latest
  rules: *rules-build
  needs:
    - build:wasm
    - job: release
      optional: true
  script:
    - apk add --no-cache curl
    - rm -rf public && mkdir public
    - cp site/* public/
    - cp assets/icon-64.png assets/logo-wordmark.png public/
    - sed -i -e "s|@PROJECT_URL@|$CI_PROJECT_URL|g" -e "s|@FORGE@|gitlab|g" public/index.html
    - cp -r ferrostat-wasm/web public/app
    # Release metadata for the page (version, which assets exist); optional.
    - |
      curl --fail --silent --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases/permalink/latest" \
        -o public/release.json || rm -f public/release.json
  artifacts:
    paths: [public]
