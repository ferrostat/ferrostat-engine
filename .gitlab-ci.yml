# GitLab CI — mirrors .github/workflows (ci.yml, pages.yml, release.yml).
#
# Runners: Linux jobs use the default gitlab.com shared runners. Windows jobs use the
# shared Windows runners (saas-windows-medium-amd64). macOS runners are only
# available on Premium/Ultimate, so the macOS jobs run only when the CI/CD
# variable MACOS_RUNNER is set to "true" (Settings > CI/CD > Variables).

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_PIPELINE_SOURCE == "web"

stages:
  - test
  - build
  - release
  - deploy

variables:
  CARGO_TERM_COLOR: always
  CARGO_HOME: $CI_PROJECT_DIR/.cargo

default:
  image: rust:latest
  interruptible: true

.rules-ci: &rules-ci
  - if: $CI_COMMIT_TAG
    when: never
  - when: on_success

.rules-release: &rules-release
  - if: $CI_COMMIT_TAG =~ /^v/

.linux:
  cache:
    key:
      prefix: $CI_JOB_NAME_SLUG
      files: [Cargo.lock]
    paths:
      - .cargo/registry/index
      - .cargo/registry/cache
      - .cargo/git/db
      - .cargo/bin
      - target

.windows:
  tags: [saas-windows-medium-amd64]
  before_script:
    - Invoke-WebRequest -Uri https://win.rustup.rs/x86_64 -OutFile rustup-init.exe
    - .\rustup-init.exe -y --profile minimal --default-toolchain stable
    - $env:Path = "$env:CARGO_HOME\bin;$env:Path"

.macos:
  image: macos-14-xcode-15
  tags: [saas-macos-medium-m1]
  before_script:
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
    - . "$CARGO_HOME/env"

# Installs wasm-bindgen-cli at the version pinned in Cargo.lock.
.wasm-setup: &wasm-setup
  - rustup target add wasm32-unknown-unknown
  - v=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/version = "\(.*\)"/\1/p')
  - |
    if [ "$(wasm-bindgen --version 2>/dev/null)" != "wasm-bindgen $v" ]; then
      cargo install wasm-bindgen-cli --version "$v" --locked --force
    fi

# ---------------------------------------------------------------- test

test:linux:
  extends: .linux
  stage: test
  rules: *rules-ci
  script:
    - cargo build --workspace --all-targets
    - cargo test --workspace

test:windows:
  extends: .windows
  stage: test
  rules: *rules-ci
  script:
    - cargo build --workspace --all-targets
    - cargo test --workspace

test:macos:
  extends: .macos
  stage: test
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $MACOS_RUNNER == "true"
  script:
    - cargo build --workspace --all-targets
    - cargo test --workspace

wasm:
  extends: .linux
  stage: test
  rules: *rules-ci
  script:
    - *wasm-setup
    - ./ferrostat-wasm/build.sh

# ------------------------------------------------------------- release
# Each build job leaves its archive in dist/; the release job uploads them to
# the generic package registry and links them from the GitLab release.

build:linux:
  extends: .linux
  stage: build
  rules: *rules-release
  variables:
    TARGET: x86_64-unknown-linux-gnu
  script:
    - cargo build --release -p ferrostat-repl -p ferrostat-gui --target $TARGET
    - name=ferrostat-$CI_COMMIT_TAG-$TARGET
    - mkdir -p "$name" dist
    - cp target/$TARGET/release/ferrostat target/$TARGET/release/ferrostat-gui "$name/"
    - cp README.md LICENSE* "$name/" 2>/dev/null || true
    - tar czf "dist/$name.tar.gz" "$name"
  artifacts:
    paths: [dist/]

build:windows:
  extends: .windows
  stage: build
  rules: *rules-release
  variables:
    TARGET: x86_64-pc-windows-msvc
  script:
    - cargo build --release -p ferrostat-repl -p ferrostat-gui --target $env:TARGET
    - $name = "ferrostat-$env:CI_COMMIT_TAG-$env:TARGET"
    - New-Item -ItemType Directory -Force -Path $name, dist | Out-Null
    - Copy-Item "target/$env:TARGET/release/ferrostat.exe", "target/$env:TARGET/release/ferrostat-gui.exe" $name
    - Copy-Item README.md, LICENSE* $name -ErrorAction SilentlyContinue
    - Compress-Archive -Path $name -DestinationPath "dist/$name.zip"
  artifacts:
    paths: [dist/]

build:macos:
  extends: .macos
  stage: build
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/ && $MACOS_RUNNER == "true"
  parallel:
    matrix:
      - TARGET: [aarch64-apple-darwin, x86_64-apple-darwin]
  script:
    - rustup target add $TARGET
    - cargo build --release -p ferrostat-repl -p ferrostat-gui --target $TARGET
    - name=ferrostat-$CI_COMMIT_TAG-$TARGET
    - mkdir -p "$name" dist
    - cp target/$TARGET/release/ferrostat target/$TARGET/release/ferrostat-gui "$name/"
    - cp README.md LICENSE* "$name/" 2>/dev/null || true
    - tar czf "dist/$name.tar.gz" "$name"
  artifacts:
    paths: [dist/]

build:wasm:
  extends: .linux
  stage: build
  rules: *rules-release
  script:
    - *wasm-setup
    - ./ferrostat-wasm/build.sh
    - apt-get update -qq && apt-get install -y -qq zip >/dev/null
    - name=ferrostat-$CI_COMMIT_TAG-wasm32-web
    - mkdir -p dist
    - cp -r ferrostat-wasm/web "$name"
    - cp README.md LICENSE* "$name/" 2>/dev/null || true
    - zip -qr "dist/$name.zip" "$name"
  artifacts:
    paths: [dist/]

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules: *rules-release
  interruptible: false
  needs:
    - build:linux
    - build:windows
    - build:wasm
    - job: build:macos
      optional: true
  script:
    - apk add --no-cache curl
    - |
      set --
      for f in dist/*; do
        asset=$(basename "$f")
        url="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/ferrostat/$CI_COMMIT_TAG/$asset"
        curl --fail --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$f" "$url"
        set -- "$@" --assets-link "{\"name\":\"$asset\",\"url\":\"$url\",\"link_type\":\"package\"}"
      done
      release-cli create --name "$CI_COMMIT_TAG" --tag-name "$CI_COMMIT_TAG" "$@"

# --------------------------------------------------------------- pages
# Publishes the browser build to GitLab Pages. Run it by hand from the
# pipeline page (or "Run pipeline" on main).

pages:
  extends: .linux
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  needs: []
  script:
    - *wasm-setup
    - ./ferrostat-wasm/build.sh
    - rm -rf public && cp -r ferrostat-wasm/web public
  artifacts:
    paths: [public]
