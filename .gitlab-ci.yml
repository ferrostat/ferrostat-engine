# GitLab CI — mirrors .github/workflows (ci.yml, pages.yml, release.yml).
#
# Pipelines on main build the release archives as job artifacts (kept 30 days);
# tags v* also publish them as a GitLab release. Pages serves site/ as the home
# page, with the browser build under /app/.
#
# Runners: Linux jobs use the default gitlab.com shared runners. Windows jobs use the
# shared Windows runners (saas-windows-medium-amd64). macOS runners are only
# available on Premium/Ultimate, so the macOS jobs run only when the CI/CD
# variable MACOS_RUNNER is set to "true" (Settings > CI/CD > Variables).

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_PIPELINE_SOURCE == "web"

stages:
  - test
  - build
  - release
  - deploy

variables:
  CARGO_TERM_COLOR: always
  CARGO_HOME: $CI_PROJECT_DIR/.cargo

default:
  image: rust:latest
  interruptible: true

.rules-ci: &rules-ci
  - if: $CI_COMMIT_TAG
    when: never
  - when: on_success

.rules-release: &rules-release
  - if: $CI_COMMIT_TAG =~ /^v/

# Archives are built on tags and on every push to the default branch.
.rules-build: &rules-build
  - if: $CI_COMMIT_TAG =~ /^v/
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "merge_request_event"

.linux:
  cache:
    key:
      prefix: $CI_JOB_NAME_SLUG
      files: [Cargo.lock]
    paths:
      - .cargo/registry/index
      - .cargo/registry/cache
      - .cargo/git/db
      - .cargo/bin
      - target

.windows:
  tags: [saas-windows-medium-amd64]
  before_script:
    - Invoke-WebRequest -Uri https://win.rustup.rs/x86_64 -OutFile rustup-init.exe
    - .\rustup-init.exe -y --profile minimal --default-toolchain stable
    - $env:Path = "$env:CARGO_HOME\bin;$env:Path"

.macos:
  image: macos-14-xcode-15
  tags: [saas-macos-medium-m1]
  before_script:
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
    - . "$CARGO_HOME/env"

# Installs wasm-bindgen-cli at the version pinned in Cargo.lock.
.wasm-setup: &wasm-setup
  # CARGO_HOME is redirected into the project for caching, so `cargo install`
  # puts binaries there rather than in the image's /usr/local/cargo/bin
  - export PATH="$CARGO_HOME/bin:$PATH"
  - rustup target add wasm32-unknown-unknown
  - v=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/version = "\(.*\)"/\1/p')
  - |
    if [ "$(wasm-bindgen --version 2>/dev/null)" != "wasm-bindgen $v" ]; then
      cargo install wasm-bindgen-cli --version "$v" --locked --force
    fi

# ---------------------------------------------------------------- test

test:linux:
  extends: .linux
  stage: test
  rules: *rules-ci
  script:
    - cargo build --workspace --all-targets
    - cargo test --workspace

test:windows:
  extends: .windows
  stage: test
  rules: *rules-ci
  script:
    - cargo build --workspace --all-targets
    - cargo test --workspace

test:macos:
  extends: .macos
  stage: test
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $MACOS_RUNNER == "true"
  script:
    - cargo build --workspace --all-targets
    - cargo test --workspace

wasm:
  extends: .linux
  stage: test
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "merge_request_event"
      when: never  # build:wasm builds it
    - when: on_success
  script:
    - *wasm-setup
    - ./ferrostat-wasm/build.sh

# ------------------------------------------------------------- release
# Each build job leaves its archive in dist/ (a job artifact, so builds from
# main can be downloaded too); on tags the release job uploads them to the
# generic package registry and links them from the GitLab release.

.artifacts: &artifacts
  name: $CI_JOB_NAME_SLUG-$CI_COMMIT_REF_SLUG
  paths: [dist/]
  expire_in: 30 days

build:linux:
  extends: .linux
  stage: build
  rules: *rules-build
  variables:
    TARGET: x86_64-unknown-linux-gnu
  script:
    - cargo build --release -p ferrostat-repl -p ferrostat-gui --target $TARGET
    - name=ferrostat-${CI_COMMIT_TAG:-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA}-$TARGET
    - mkdir -p "$name" dist
    - cp target/$TARGET/release/ferrostat target/$TARGET/release/ferrostat-gui "$name/"
    - cp README.md LICENSE* "$name/" 2>/dev/null || true
    - tar czf "dist/$name.tar.gz" "$name"
  artifacts: *artifacts

build:windows:
  extends: .windows
  stage: build
  rules: *rules-build
  variables:
    TARGET: x86_64-pc-windows-msvc
  script:
    - cargo build --release -p ferrostat-repl -p ferrostat-gui --target $env:TARGET
    - $ver = if ($env:CI_COMMIT_TAG) { $env:CI_COMMIT_TAG } else { "$env:CI_COMMIT_REF_SLUG-$env:CI_COMMIT_SHORT_SHA" }
    - $name = "ferrostat-$ver-$env:TARGET"
    - New-Item -ItemType Directory -Force -Path $name, dist | Out-Null
    - Copy-Item "target/$env:TARGET/release/ferrostat.exe", "target/$env:TARGET/release/ferrostat-gui.exe" $name
    - Copy-Item README.md, LICENSE* $name -ErrorAction SilentlyContinue
    - Compress-Archive -Path $name -DestinationPath "dist/$name.zip"
  artifacts: *artifacts

build:macos:
  extends: .macos
  stage: build
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/ && $MACOS_RUNNER == "true"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "merge_request_event" && $MACOS_RUNNER == "true"
  parallel:
    matrix:
      - TARGET: [aarch64-apple-darwin, x86_64-apple-darwin]
  script:
    - rustup target add $TARGET
    - cargo build --release -p ferrostat-repl -p ferrostat-gui --target $TARGET
    - name=ferrostat-${CI_COMMIT_TAG:-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA}-$TARGET
    - mkdir -p "$name" dist
    - cp target/$TARGET/release/ferrostat target/$TARGET/release/ferrostat-gui "$name/"
    - cp README.md LICENSE* "$name/" 2>/dev/null || true
    - tar czf "dist/$name.tar.gz" "$name"
  artifacts: *artifacts

build:wasm:
  extends: .linux
  stage: build
  rules: *rules-build
  script:
    - *wasm-setup
    - ./ferrostat-wasm/build.sh
    - apt-get update -qq && apt-get install -y -qq zip >/dev/null
    - name=ferrostat-${CI_COMMIT_TAG:-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA}-wasm32-web
    - mkdir -p dist
    - cp -r ferrostat-wasm/web "$name"
    - cp README.md LICENSE* "$name/" 2>/dev/null || true
    - zip -qr "dist/$name.zip" "$name"
  artifacts:
    <<: *artifacts
    paths: [dist/, ferrostat-wasm/web/]

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules: *rules-release
  interruptible: false
  needs:
    - build:linux
    - build:windows
    - build:wasm
    - job: build:macos
      optional: true
  script:
    - apk add --no-cache curl
    - |
      set --
      for f in dist/*; do
        asset=$(basename "$f")
        url="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/ferrostat/$CI_COMMIT_TAG/$asset"
        curl --fail --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$f" "$url"
        # version-free path, so <project>/-/releases/permalink/latest/downloads/<stable>
        # always points at the newest release (the home page links there)
        case "$asset" in
          *-x86_64-unknown-linux-gnu.tar.gz) stable=ferrostat-linux-x86_64.tar.gz ;;
          *-x86_64-pc-windows-msvc.zip)      stable=ferrostat-windows-x86_64.zip ;;
          *-aarch64-apple-darwin.tar.gz)     stable=ferrostat-macos-aarch64.tar.gz ;;
          *-x86_64-apple-darwin.tar.gz)      stable=ferrostat-macos-x86_64.tar.gz ;;
          *-wasm32-web.zip)                  stable=ferrostat-web.zip ;;
          *)                                 stable=$asset ;;
        esac
        set -- "$@" --assets-link "{\"name\":\"$asset\",\"url\":\"$url\",\"filepath\":\"/$stable\",\"link_type\":\"package\"}"
      done
      release-cli create --name "$CI_COMMIT_TAG" --tag-name "$CI_COMMIT_TAG" "$@"

# --------------------------------------------------------------- pages
# Home page (site/) with download links to the latest release, and the browser
# build under /app/. Deployed automatically on every push to main and after
# each release.

pages:
  stage: deploy
  image: alpine:latest
  rules: *rules-build
  needs:
    - build:wasm
    - job: release
      optional: true
  script:
    - apk add --no-cache curl
    - rm -rf public && mkdir public
    - cp site/* public/
    - cp assets/icon-64.png assets/logo-wordmark.png public/
    - sed -i "s|@PROJECT_URL@|$CI_PROJECT_URL|g" public/index.html
    - cp -r ferrostat-wasm/web public/app
    # Release metadata for the page (version, which assets exist); optional.
    - |
      curl --fail --silent --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases/permalink/latest" \
        -o public/release.json || rm -f public/release.json
  artifacts:
    paths: [public]
